<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cargo Run — GameLoom #7</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; }
  #game { width: 100%; height: 100%; display: block; cursor: crosshair; }
  #hud {
    position: fixed; top: 12px; left: 12px; font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 17px; color: #d7e0ea; background: rgba(10, 14, 20, 0.68);
    padding: 10px 14px; border: 1px solid #2c3a4a; border-radius: 6px;
    line-height: 1.5; pointer-events: none; white-space: pre; z-index: 10;
  }
  #hud-power { color: #57e389; }
  #hud-cargo { color: #ffd75e; }
  #hud-msg { color: #ff9d5e; min-height: 1.3em; }
  #hud-controls { color: #8fa1b3; font-size: 12px; margin-top: 6px; }
  #overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; background: rgba(5, 8, 12, 0.74); font-family: "Cascadia Mono", Consolas, monospace; z-index: 20;
  }
  #overlay h1 { color: #57e389; font-size: 44px; margin: 0 0 10px; letter-spacing: 2px; }
  #overlay p { color: #d7e0ea; font-size: 20px; margin: 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="hud-power">POWER: 0/3</div>
  <div id="hud-cargo">CARGO: NONE</div>
  <div id="hud-msg"></div>
  <div id="hud-controls">E: ramasser / installer &middot; Q: abandonner<br>WASD / fleches: bouger &middot; souris: viser &middot; ESPACE: sauter</div>
</div>
<div id="overlay"><h1>CARGO COMPLETE</h1><p>EXIT REACHED</p></div>
<script type="module" src="./src/game/cargo/main.ts"></script>
</body>
</html>
