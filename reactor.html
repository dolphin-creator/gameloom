<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GameLoom #6 — Reactor Defense</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #0b0e14; }
    #game { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 12px; left: 12px; pointer-events: none;
      color: #e8ecf4; font: 600 18px/1.5 "Courier New", monospace; text-shadow: 0 1px 3px #000;
    }
    #hud .line { background: rgba(10, 14, 22, 0.55); padding: 6px 10px; border-left: 3px solid #4da3ff; margin-bottom: 6px; }
    #hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); pointer-events: none;
      color: #ffe9a8; font: 700 16px "Courier New", monospace; text-shadow: 0 1px 3px #000;
    }
    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px;
      align-items: center; justify-content: center; background: rgba(5, 8, 14, 0.72);
      color: #fff; font: 700 42px/1.3 "Courier New", monospace; text-align: center;
    }
    #overlay.hidden { display: none; }
    #overlay .sub { font-size: 22px; color: #9fd0ff; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="line" id="hud-relais">RELAIS 0/3</div>
    <div class="line" id="hud-reactor">RÉACTEUR 0 %</div>
  </div>
  <div id="hint"></div>
  <div id="overlay" class="hidden">
    <div id="overlay-title"></div>
    <div class="sub" id="overlay-sub"></div>
  </div>
  <script type="module" src="./src/game/reactor/main.ts"></script>
</body>
</html>
